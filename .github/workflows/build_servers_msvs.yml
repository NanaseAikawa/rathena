name: Build servers with MSVS EXE

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Nutzt alle CPU-Kerne (/m) und baut inkrementell (-t:build) für maximale Geschwindigkeit
      - name: Build solution in Release (Pre-Renewal)
        run: msbuild rAthena.sln -t:build -m -property:Configuration=Release /p:Platform=x64 /p:DefineConstants="BUILDBOT%3BPRERE"

      # Sammelt alle kompilierten Exen, Configs und DBs für uns
      - name: Server-Dateien fuer den Upload sammeln
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build_output
          Copy-Item -Path "*.exe" -Destination "build_output\" -Force
          Copy-Item -Path "conf" -Destination "build_output\conf" -Recurse -Force
          Copy-Item -Path "db" -Destination "build_output\db" -Recurse -Force

      # Lädt unsere fertige ZIP-Datei hoch
      - name: ZIP-Datei fuer uns bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: rAthena-Windows-PreRenewal
          path: build_output/
